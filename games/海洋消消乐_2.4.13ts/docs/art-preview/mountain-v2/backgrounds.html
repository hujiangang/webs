<header><small>背景设计 · 2026.10.24</small><h1>同一片山林，五幅画面</h1><p>为加载、主页和局内分别安排景深与留白。局内细节集中在边缘，中央承托棋盘。这里展示未叠加 UI 的原图，可点击查看完整尺寸。</p><a class="back" href="design.html">查看配套界面设计 →</a></header>
<main>
<figure><a href="loading-mountain.png" target="_blank"><img src="loading-mountain.png" alt="加载背景，晨光松林与近景菌子"></a><figcaption><h2>01 · 加载：山林晨光</h2><p>完整环境镜头，下部菌子点景，上部留给标题。</p><a href="loading-mountain.png" download>下载原图 · 941 × 1672</a></figcaption></figure>
<figure><a href="home-mountain.png" target="_blank"><img src="home-mountain.png" alt="主页背景，层叠远山和安静薄雾"></a><figcaption><h2>02 · 主页：林间薄雾</h2><p>浅色远景与中心留白，关卡和文字占主导。</p><a href="home-mountain.png" download>下载原图 · 941 × 1672</a></figcaption></figure>
<figure><a href="game-pine.png" target="_blank"><img src="game-pine.png" alt="松林局内背景，边缘松针松塔和蕨叶"></a><figcaption><h2>03 · 局内：松林晨雾</h2><p>柔和暖绿，作为主要局内背景方向。</p><a href="game-pine.png" download>下载原图 · 941 × 1672</a></figcaption></figure>
<figure><a href="game-rain.png" target="_blank"><img src="game-rain.png" alt="雨后局内背景，湿润苔石与灰绿色林雾"></a><figcaption><h2>04 · 局内：雨后青苔</h2><p>冷灰绿变化，湿苔和水滴仅留在画面边缘。</p><a href="game-rain.png" download>下载原图 · 941 × 1672</a></figcaption></figure>
<figure><a href="game-red-earth.png" target="_blank"><img src="game-red-earth.png" alt="红土局内背景，暖褐山坡松针与松塔"></a><figcaption><h2>05 · 局内：暖光红土</h2><p>暖褐与橄榄绿，保留自然红土地表质感。</p><a href="game-red-earth.png" download>下载原图 · 940 × 1672</a></figcaption></figure>
