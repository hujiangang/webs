<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}菌子网站{% endblock %}</title>
    <link rel="stylesheet" href="/static/site.css?v=20260805b">
</head>
<body>
    <header class="site-header">
        <a class="logo" href="/" aria-label="首页">
            <span class="logo-icon" aria-hidden="true"></span>
        </a>
        <nav class="nav">
            <a class="nav-link {% if active == 'home' %}active{% endif %}" href="/">首页</a>
            <a class="nav-link {% if active == 'gallery' %}active{% endif %}" href="/mushrooms">菌子图鉴</a>
            <a class="nav-link" href="#">菌子小游戏</a>
            <a class="nav-link" href="#">野生菌安全科普</a>
        </nav>
    </header>

    <main class="page-main {% block main_class %}{% endblock %}">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <p class="footer-record">备案信息待完善</p>
            <nav class="footer-links" aria-label="底部链接">
                <a href="#">关于我们</a>
                <a href="#">数据来源</a>
                <a href="#">野生菌安全提示</a>
                <a href="#">联系方式</a>
            </nav>
        </div>
    </footer>
    <script src="/static/site.js?v=20260805b"></script>
</body>
</html>
