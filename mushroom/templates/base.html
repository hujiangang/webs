<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}菌子网站{% endblock %}</title>
    {% if site_icon_url %}
        <link rel="icon" href="{{ site_icon_url }}">
    {% endif %}
    <link rel="stylesheet" href="/static/site.css?v=20260817b">
</head>
<body>
    <header class="site-header">
        <a class="logo" href="/" aria-label="首页">
            {% if site_icon_url %}
                <img class="logo-image" src="{{ site_icon_url }}" alt="网站头像">
            {% else %}
                <span class="logo-icon" aria-hidden="true"></span>
            {% endif %}
        </a>
        <div class="header-content">
            <nav class="nav">
                <a class="nav-link {% if active == 'home' %}active{% endif %}" href="/">首页</a>
                <a class="nav-link {% if active == 'gallery' %}active{% endif %}" href="/mushrooms">菌子图鉴</a>
                <a class="nav-link {% if active == 'games' %}active{% endif %}" href="/games">菌子小游戏</a>
                <a class="nav-link" href="/#safety-tip">野生菌安全科普</a>
            </nav>
        </div>
    </header>

    <main class="page-main {% block main_class %}{% endblock %}">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <p class="footer-record">🍄 云南菌子网 · 收录 {{ mushroom_count or 56 }} 种菌子 · 仅供科普，采食请咨询专业人员</p>
            <nav class="footer-links" aria-label="底部链接">
                <a href="/mushrooms">菌子图鉴</a>
                <a href="/games">菌子小游戏</a>
                <a href="/#safety-tip">安全提示</a>
                <a href="/mushrooms?category=toxic&page=1&keyword=">毒菌警示</a>
            </nav>
        </div>
    </footer>
    <script src="/static/site.js?v=20260817a"></script>
</body>
</html>
