<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}菌子网站{% endblock %}</title>
    {% if site_icon_url %}
        <link rel="icon" href="{{ site_icon_url }}">
    {% endif %}
    <link rel="stylesheet" href="/static/site.css?v=20260805e">
</head>
<body>
    <header class="site-header">
        <a class="logo" href="/" aria-label="首页">
            {% if site_icon_url %}
                <img class="logo-image" src="{{ site_icon_url }}" alt="网站头像">
            {% else %}
                <span class="logo-icon" aria-hidden="true"></span>
            {% endif %}
        </a>
        <div class="header-content">
            <nav class="nav">
                <a class="nav-link {% if active == 'home' %}active{% endif %}" href="/">首页</a>
                <a class="nav-link {% if active == 'gallery' %}active{% endif %}" href="/mushrooms">菌子图鉴</a>
                <a class="nav-link" href="#">菌子小游戏</a>
                <a class="nav-link" href="#">野生菌安全科普</a>
            </nav>
            <form class="site-search" action="/mushrooms" method="get" role="search">
                <input type="hidden" name="category" value="all">
                <input type="hidden" name="page" value="1">
                <span class="search-icon" aria-hidden="true"></span>
                <input class="search-input" type="search" name="keyword" value="{{ search_keyword or '' }}" placeholder="搜索菌子名称" aria-label="搜索菌子名称">
            </form>
        </div>
    </header>

    <main class="page-main {% block main_class %}{% endblock %}">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <p class="footer-record">备案信息待完善</p>
            <nav class="footer-links" aria-label="底部链接">
                <a href="#">关于我们</a>
                <a href="#">数据来源</a>
                <a href="#">野生菌安全提示</a>
                <a href="#">联系方式</a>
            </nav>
        </div>
    </footer>
    <script src="/static/site.js?v=20260805e"></script>
</body>
</html>
