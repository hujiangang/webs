{% from 'components.html' import icon %}
<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>修改管理密码 · 菌野</title><link rel="icon" href="/static/images/mark.svg"><link rel="stylesheet" href="/static/cms.css?v=20260908"></head>
<body class="login-body"><main class="login-card">
    <div class="cms-brand">{{ icon('mushroom') }}<span>菌野 <small>内容工作台</small></span></div>
    <h1>修改管理密码</h1>
    <p class="cms-description">新密码至少12位。保存后，其他页面的旧登录会话会失效。</p>
    {% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}
    <form action="/admin/password" method="post">
        <label>当前密码<input type="password" name="current_password" maxlength="128" autocomplete="current-password" required></label>
        <label>新密码<input type="password" name="new_password" minlength="12" maxlength="128" autocomplete="new-password" required></label>
        <label>再次输入新密码<input type="password" name="confirm_password" minlength="12" maxlength="128" autocomplete="new-password" required></label>
        <button type="submit" class="cms-button">保存新密码</button>
    </form>
    <p class="login-foot"><a href="/admin/mushrooms">返回菌子资料</a> · <a href="/admin/content">内容工作台</a></p>
</main></body></html>
