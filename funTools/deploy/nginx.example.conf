# 放入 Nginx 的 http 配置作用域，并替换域名与证书路径。
limit_req_zone $binary_remote_addr zone=funtools_ai:10m rate=6r/m;

server {
    listen 80;
    server_name tools.example.com admin-tools.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name tools.example.com;
    ssl_certificate /etc/ssl/funtools/fullchain.pem;
    ssl_certificate_key /etc/ssl/funtools/privkey.pem;
    client_max_body_size 24m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /api/remove-watermark {
        limit_req zone=funtools_ai burst=2 nodelay;
        limit_req_status 429;
        proxy_read_timeout 300s;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}

server {
    listen 443 ssl;
    server_name admin-tools.example.com;
    ssl_certificate /etc/ssl/funtools/fullchain.pem;
    ssl_certificate_key /etc/ssl/funtools/privkey.pem;
    client_max_body_size 6m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
